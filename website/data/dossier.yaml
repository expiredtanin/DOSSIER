# Inhalt der DOSSIER-Landingpage. Bearbeitbar ohne Template-Änderung.

features:
  - title: "2D-Zeichenwerkzeuge"
    body: "Linie, Polylinie, Rechteck, Kreis, Bogen, Text/Textspalte, Bild/PDF-Import — klassisches Freihand-Zeichnen neben den semantischen Bauteilen, im selben Plan."
  - title: "Semantisches Modell"
    body: "Mehrschichtige Wände, L-Eck-Gehrung und Prioritäts-T-/X-Stösse — konsistent in Grundriss, 3D-Viewport und Live-Schnitt."
  - title: "Parametrische Bauteile"
    body: "Wände, Decken, Treppen (gerade · L · Wendel), Dächer (Flach/Pult/Sattel/Walm/Mansarde/Zelt), Stützen."
  - title: "Türen &amp; Fenster"
    body: "In Wänden gehostet, mit Rahmen/Zarge/Kämpfer/Oberlicht und echten Rechteck-Löchern im 3D-Wandkörper."
  - title: "Kommandosystem"
    body: "Getippte Koordinaten (5,3 · r5,3 · 5&lt;45), Tab-Feldzyklus, Snapping, Grips, Trim/Split/Join."
  - title: "Live 2D↔3D-Schnitt"
    body: "Eine Schnittebene im 3D-Viewport folgt derselben Prioritäts-Logik wie der 2D-Plan-Schnitt. Keine Diskrepanz."
  - title: "Vektor-Export"
    body: "PDF mit Mehrseiten-Layouts, DXF, IFC4 (mit echten Fenster-/Tür-Löchern), STL/OBJ, CSV-Bauteilliste."
  - title: "SIA-416-Räume"
    body: "Automatische Flächenbilanz mit CSV-Export. Zeichnungsnormen und Symbolik nach SIA."
  - title: "Materialbibliothek"
    body: "13 gebündelte PBR-Starter plus Live-Suche der kompletten ambientCG-Bibliothek (1K/2K/4K, On-Demand)."
  - title: "Layouts &amp; Plansätze"
    body: "Mehrere Viewports pro Blatt, Ausschnitte (View-Snapshots), Kamera-Presets, Norden-Rotation."
  - title: "Swisstopo &amp; DXF"
    body: "swissBUILDINGS3D / ALTI3D / SWISSIMAGE, radiusgenau zugeschnitten; OSM-Kontext; DXF/DWG, .lin/.pat."
  - title: "Native Desktop-App"
    body: "Randlose Fenster, native Speichern/Öffnen-Dialoge, eigenes .obp-Format mit OS-Level-Lock gegen Doppelöffnen."
  - title: "Resource Manager"
    body: "Component-/Hatch-/Linien-/Typ-Editoren, regelbasierte Overrides, dockbare Panels, i18n (de/en)."

stack:
  - "TypeScript / React"
  - "Rust / wgpu"
  - "WebGPU / WebGL2"
  - "Tauri"
  - "Electron"
