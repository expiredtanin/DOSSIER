<!doctype html>
<html lang="de">
<head>
  {{ partial "head.html" . }}
  {{- $js := resources.Get "js/site.js" | js.Build (dict "minify" true) | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</head>
<body class="docs-page">
  <div class="plangrid" aria-hidden="true"></div>
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
</body>
</html>
