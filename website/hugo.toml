baseURL = "https://dossier.openbureau.ch/"
title = "Dossier"
languageCode = "de-CH"
defaultContentLanguage = "de"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "Dossier ist ein freies CAD für Architektur. Du baust ein Gebäude aus Bauteilen, Grundriss, Schnitt und Ansicht werden daraus berechnet. Open-Source-CAAD unter AGPL-3.0."
  version = "0.1.0"

  repo     = "https://github.com/expiredtanin/DOSSIER"
  releases = "https://github.com/expiredtanin/DOSSIER/releases"
  bureau   = "https://openbureau.ch"
