# Tests bei jedem Push/PR auf master ([57]). Die WASM-Pakete (src/engine/pkg*) sind nicht im Repo und
# werden hier gebaut (Tests wie truckBrep.wasm.test.ts und die e2e-Suite lesen sie). Jedes Crate hat
# sein eigenes target/ (core teilt sich nichts mit render2d/render3d); Swatinem/rust-cache cached sie.
name: check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/core
            src-tauri/render2d
            src-tauri/render3d
            src-tauri/kernel2d
            src-tauri/trucksolid
            src-tauri/fileio
            src-tauri/hatchgen
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      # Poppler (pdftotext, pdffonts): Text der PDFs steht als Glyphen-Nummern, die PDF-Text-/Anonymitäts-Prüfungen ([208])
      # lesen ihn damit. Fehlt es, scheitern diese Tests in der CI hart (CI=true), sie laufen nie still leer durch.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci || (sleep 30 && npm ci) || (sleep 90 && npm ci)  # Netz-Aussetzer (z. B. 504 beim wasm-pack-Download)
      # IFC-Prüfung in exportIfc.{validate,quantities,fachplaner}.test.ts ([B1], [259]; numpy für die Mengenprüfung); ohne ifcopenshell würde sie übersprungen.
      - run: pip install ifcopenshell pytest ezdxf numpy
      - name: WASM-Pakete bauen
        run: |
          # Fällt das mitgelieferte wasm-opt um (alte Binaryen-Version, Table.grow), ohne Optimierung neu bauen.
          for s in core truck engine3d engine fileio; do
            npm run "build:$s" || { echo "build:$s mit wasm-opt fehlgeschlagen, neu mit --no-opt"; npm run "build:$s" -- --no-opt; }
          done
      - run: npm run check
      - run: npm run build:cli
  # Lizenzprüfung der Rust-Abhängigkeiten ([130]): Allowlist in src-tauri/deny.toml (AGPL-3.0-verträglich).
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - name: cargo deny check licenses
        run: |
          for c in core render2d render3d kernel2d trucksolid fileio hatchgen; do
            echo "== $c"
            cargo deny --manifest-path "src-tauri/$c/Cargo.toml" --config src-tauri/deny.toml check licenses
          done
          echo "== cad-tauri"
          cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml check licenses
  # UI-Suite ([49]): bedient die gebaute Web-App wie ein Mensch (Playwright, Chromium headless).
  # Eigener Job, damit `npm run check` schnell bleibt; läuft parallel dazu.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/core
            src-tauri/render2d
            src-tauri/render3d
            src-tauri/trucksolid
            src-tauri/fileio
          shared-key: e2e
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      # Poppler (pdftotext, pdffonts): Text der PDFs steht als Glyphen-Nummern, die PDF-Text-/Anonymitäts-Prüfungen ([208])
      # lesen ihn damit. Fehlt es, scheitern diese Tests in der CI hart (CI=true), sie laufen nie still leer durch.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci || (sleep 30 && npm ci) || (sleep 90 && npm ci)  # Netz-Aussetzer (z. B. 504 beim wasm-pack-Download)
      - name: WASM-Pakete bauen
        run: |
          for s in core truck engine3d engine fileio; do
            npm run "build:$s" || { echo "build:$s mit wasm-opt fehlgeschlagen, neu mit --no-opt"; npm run "build:$s" -- --no-opt; }
          done
      - name: Playwright-Version lesen
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pwcache.outputs.cache-hit == 'true'
      # `npm run e2e` baut selbst nach dist-test und startet vite preview (playwright.config.ts).
      - run: npm run e2e
      # Bei Fehlern: Screenshots + Traces (test-results/) zum Ansehen mit `npx playwright show-trace`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
