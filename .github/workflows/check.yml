# Tests bei jedem Push (lessons-bimcraft [57]). Braucht einen Actions-Runner mit
# Docker/Node; ohne Runner passiert nichts. Die WASM-Pakete (src/engine/pkg*) sind nicht im
# Repo und werden hier gebaut, weil Tests wie truckBrep.wasm.test.ts sie lesen.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked
      - run: npm ci
      # IFC-Prüfung in exportIfc.validate.test.ts ([B1]); ohne ifcopenshell würde sie übersprungen.
      - run: pip install ifcopenshell pytest ezdxf
      - run: npm run build:core && npm run build:truck && npm run build:engine3d && npm run build:engine && npm run build:fileio
      - run: npm run check
  # UI-Suite ([49]): bedient die gebaute Web-App wie ein Mensch (Playwright, Chromium headless).
  # Eigener Job, damit `npm run check` schnell bleibt; läuft parallel dazu.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked
      - run: npm ci
      - run: npm run build:core && npm run build:truck && npm run build:engine3d && npm run build:engine && npm run build:fileio
      - run: npx playwright install --with-deps chromium
      # `npm run e2e` baut selbst nach dist-test und startet vite preview (playwright.config.ts).
      - run: npm run e2e
      # Bei Fehlern: Screenshots + Traces (test-results/) zum Ansehen mit `npx playwright show-trace`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
