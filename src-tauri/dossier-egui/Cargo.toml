# Alternative, native Oberfläche für Dossier in egui (Probe für den Maintainer, s. README.md).
# Eigener leerer Workspace-Block wie core/kernel2d: entkoppelt das Crate vom cad-tauri-Workspace,
# damit seine schweren Abhängigkeiten (eframe/winit/wgpu) weder die Tauri-App noch `npm run check`
# berühren.
[workspace]

[package]
name = "dossier-egui"
version = "0.1.0"
edition = "2021"
description = "Dossier als native egui-App: Grundriss (render2d) und 3D (render3d) eingebettet, Daten aus dem CLI-Ansichtspaket"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# egui 0.35 ist die neueste Reihe auf wgpu 29 (0.36/0.37 sind auf wgpu 30). render2d/render3d
# hängen an wgpu 29 (glyphon 0.11) — mit 0.35 teilen App und Engines EIN wgpu-Device, die
# Engines rendern direkt in Texturen, die egui ohne Kopie anzeigt.
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wayland", "x11", "wgpu"] }
egui = "0.35"
egui-wgpu = "0.35"
egui_dock = "0.20"
wgpu = "29"
render2d = { path = "../render2d", features = ["render"] }
render3d = { path = "../render3d", features = ["render"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
# Systemschrift suchen (dieselbe Version wie render2d/cosmic-text, kein Duplikat).
fontdb = "0.23"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3

# Abhängigkeiten auch im Debug-Build optimieren (wgpu/egui sind unoptimiert zäh).
[profile.dev.package."*"]
opt-level = 2
