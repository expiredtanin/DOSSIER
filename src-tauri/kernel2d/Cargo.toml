# Eigener leerer Workspace-Block: entkoppelt kernel2d vollstaendig vom
# cad-tauri-Workspace (src-tauri/Cargo.toml), damit `cargo test` aus diesem
# Verzeichnis heraus nicht faelschlich dessen Workspace erbt. Muster: render2d/render3d.
[workspace]

[package]
name = "kernel2d"
version = "0.1.0"
edition = "2021"
description = "2D-Geometrie-Kern von Dossier — handgeschriebene f64-Mathematik, headless per `cargo test`. Produktiv als Pfad-Abhaengigkeit von dossier-core (src-tauri/core, WASM-Paket pkgCore)."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
