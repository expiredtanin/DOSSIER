# Kein eigener [workspace]-Block (wie render3d): der Parent `src-tauri/Cargo.toml` schliesst das Crate per
# `exclude` aus; es baut standalone (`cd hatchgen && cargo test`) und als Pfad-Abhaengigkeit von core/render3d.

[package]
name = "dossier-hatch"
version = "0.1.0"
edition = "2021"
description = "Schraffur-Generator (Linien, Schichtmuster) als eigenes Crate: dossier-core (Plan/Schnitt/Ansicht) und render3d (Live-Schnitt) zeichnen damit dieselben Linien. Zahl-Helfer (jsnum, jsmath) ueber libm."
license = "AGPL-3.0-or-later"

[lib]
name = "dossier_hatch"

[dependencies]
libm = "0.2"
