# Kein eigener [workspace]-Block (wie render3d): der Parent `src-tauri/Cargo.toml` schliesst das Crate per
# `exclude` aus; es baut standalone (`cd hatchgen && cargo test`) und als Pfad-Abhaengigkeit von core/render3d.

[package]
name = "dossier-hatch"
version = "0.1.0"
edition = "2021"
description = "Schraffur-Generator (Linien, Schichtmuster) als eigenes Crate: dossier-core (Plan/Schnitt/Ansicht) und render3d (Live-Schnitt) zeichnen damit dieselben Linien. Nur JS-Zahlsemantik (jsnum, jsmath), keine weiteren Abhaengigkeiten."
license = "AGPL-3.0-or-later"

[lib]
name = "dossier_hatch"

[features]
default = []
# Math-Aufrufe der JS-Engine (bitgleich zu TS), nur wasm32; vom Kern (Feature "web") durchgereicht.
web = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
