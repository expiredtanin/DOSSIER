# Eigener leerer Workspace-Block wie render2d/kernel2d: entkoppelt das Crate vom cad-tauri-Workspace.
[workspace]

[package]
name = "dossier-core"
version = "0.1.0"
edition = "2021"
description = "Rust-Kern von Dossier (Umstellung des TS-Kerns, Etappen 0-4): Geometrie, Ableitung, spaeter Modell und Ops. Headless per `cargo test`, per wasm-pack (Feature \"web\") als src/engine/pkgCore."
license = "AGPL-3.0-or-later"

[lib]
name = "dossier_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Browser-/Node-Bindings (wasm-bindgen); nur fuer wasm32-unknown-unknown.
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dossier-hatch/web"]

[dependencies]
i_overlay = { version = "9.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
kernel2d = { path = "../kernel2d" }
# Schraffur-Generator + JS-Zahlsemantik (auch von render3d genutzt), s. hatchgen/src/lib.rs.
dossier-hatch = { path = "../hatchgen" }
# Analytischer Schnitt-Extraktor (`section::cut_section`, GPU-frei, nur serde) für Schnitt/Ansicht im Kern ([K3c]).
render3d = { path = "../render3d", default-features = false }
# Kürzeste Dezimaldarstellung wie serde_json (Zahlen, die früher über JSON reisten, bitgleich nachbilden).
zmij = "1"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# TS-Typen aus dem Rust-Modell ([K4] S4): `src/model/types.generated.ts`, s. `model/ts_export.rs`.
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }

[profile.release]
opt-level = 3
lto = true
