[workspace]

[package]
name = "trucksolid"
version = "0.1.0"
edition = "2021"
description = "Profil-Extrusion via truck B-Rep → tesselliertes Mesh für render3d"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
web = [
    "dep:wasm-bindgen",
    "dep:serde_json",
    "dep:console_error_panic_hook",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# truck-modeling bringt truck-geometry/topology/polymesh transitiv mit (alle
# auf derselben kompatiblen Version). Nur truck-modeling explizit pinnen —
# keine separaten geometry/topology-Einträge, die einen Versions-Konflikt erzeugen.
truck-modeling = "0.6"
truck-meshalgo = "0.4"
truck-shapeops = "0.4"
truck-stepio = "0.3"
# Mesh-Ebenen-Boolean (Fallback bei koinzidenten Flächen, `boolean.rs`): Port von Manifold, reines
# Rust, Apache-2.0. Exakte Version gepinnt (junges Crate, ein Maintainer), NOTICE [51].
manifold-rust = "=0.19.1"

[dev-dependencies]
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
